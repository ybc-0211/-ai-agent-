name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: npm run test:e2e
        env:
          E2E_ALL_BROWSERS: "1"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Format check (project files)
        run: npx oxfmt --check server shared src e2e README.md GETTING_STARTED.md docs/architecture.md playwright.config.ts

      # AGENTS.md and SUBMIT.md are protected files with a pre-existing
      # formatting baseline. Run the full check but do not block CI on them.
      - name: Format check (full repository, informational)
        run: npm run fmt:check
        continue-on-error: true

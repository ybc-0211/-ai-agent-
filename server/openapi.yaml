openapi: 3.1.0
info:
  title: Todo Agent 任务 API
  version: 1.1.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 列出任务，可按状态或优先级筛选
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, open, completed]
            default: all
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/Priority" }
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建任务，可设置优先级、截止日期和父任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
                priority: { $ref: "#/components/schemas/Priority" }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                parentId:
                  type: string
                  description: 可选；父任务 id
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 编辑标题、完成状态、优先级、截止日期或父任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                priority: { $ref: "#/components/schemas/Priority" }
                dueDate:
                  oneOf:
                    - { $ref: "#/components/schemas/DueDate" }
                    - { type: "null" }
                parentId: { type: string }
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      summary: 删除任务；父任务会级联删除子任务
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    Priority:
      type: string
      enum: [low, medium, high]
      default: medium
    DueDate:
      type: string
      description: 截止日期，格式 YYYY-MM-DD
      pattern: '^\d{4}-\d{2}-\d{2}$'
    Task:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        priority: { $ref: "#/components/schemas/Priority" }
        dueDate:
          oneOf:
            - { $ref: "#/components/schemas/DueDate" }
            - { type: "null" }
        parentId:
          type: string
          description: 父任务 id；空表示顶层任务
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
